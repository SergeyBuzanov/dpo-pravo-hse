name: CI

# Прогон смоук-теста на каждый push и PR + сборка образа админки.
# Деплой намеренно выключен: пока нет сервера и домена — включается одним
# снятием комментария, когда появятся секреты (см. блок deploy ниже).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Прав на запись ни одному job не нужно: тесты только читают репозиторий.
# Без этого блока действует умолчание репозитория, а оно нередко даёт токену
# contents: write — то есть любая скомпрометированная сторонняя action смогла
# бы запушить коммит.
permissions:
  contents: read

jobs:
  unit:
    name: Юнит-тесты (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Установить Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # Маска *.test.js обязательна: голый путь к каталогу раннер Node
      # разворачивает не на всех платформах.
      - name: Прогон юнит-тестов
        run: node --test tests/unit/*.test.js

  smoke:
    name: Смоук-тест (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Установить uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Окружение и Playwright
        run: |
          uv venv .venv-tests
          source .venv-tests/bin/activate
          # Версия запиннена: actions здесь фиксируются по SHA, а незапиненный
          # Playwright тянул бы свежий Chromium и мог уронить CI без изменений
          # в коде. Обновлять осознанно, вместе с локальным .venv-tests.
          uv pip install 'playwright==1.62.0'
          python -m playwright install --with-deps chromium

      # Node нужен следующему шагу: security-тесты поднимают admin-server.js
      # и static-server.js. На раннере Node есть и так, но версию фиксируем —
      # иначе прогон зависит от того, что сегодня стоит в образе GitHub.
      - name: Установить Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Прогон смоук-тестов
        run: |
          source .venv-tests/bin/activate
          python tests/smoke_test.py

      # Security-тесты в CI не запускались вообще — а именно они стерегут
      # белый список nginx, из-за отсутствия которого наружу отдавались
      # учётные данные админки. Проверка, которая не запускается, ничего не
      # стережёт.
      - name: Прогон security-тестов
        run: |
          source .venv-tests/bin/activate
          python tests/security_test.py

  build:
    name: Сборка образа
    runs-on: ubuntu-latest
    needs: [unit, smoke]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Собрать образ админки
        run: docker build -t dpo-admin:${{ github.sha }} .

      - name: Проверить конфиг compose
        run: docker compose config --quiet

      # Конфиг nginx не проверялся нигде: он не входит в образ админки, а
      # монтируется в контейнер веб-сервера при запуске — ошибка в нём
      # обнаружилась бы только на живом сервере.
      - name: Проверить конфиг nginx
        run: |
          docker run --rm \
            -v "$PWD/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      # Живая проверка выдачи. Статическая проверка в security_test.py ловит
      # пропажу правила, но не сломанную регулярку — а именно она однажды
      # открыла наружу .admin-credentials.json с логином и хешем пароля.
      # Поэтому поднимаем настоящий nginx с настоящим монтированием проекта и
      # дёргаем адреса: публичные должны отвечать, приватные — давать 404.
      - name: Проверить, что nginx не отдаёт лишнего
        run: |
          set -euo pipefail
          docker run -d --name nginx-check -p 8099:80 \
            -v "$PWD/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD:/usr/share/nginx/html:ro" \
            nginx:1.27-alpine
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8099/ && break || sleep 1
          done

          fail=0
          check() {  # $1 — путь, $2 — ожидаемый код
            # «|| echo 000» обязателен: при set -e упавший curl (сеть, а не
            # ответ сервера) молча оборвал бы весь шаг вместо понятного провала
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8099$1" || echo 000)
            if [ "$code" != "$2" ]; then
              echo "  ✗ $1 → $code (ожидалось $2)"; fail=1
            else
              echo "  ✓ $1 → $code"
            fi
          }
          echo "Публичное:"
          for p in / /favicon.svg /robots.txt /sitemap.xml /js/cookie-consent.js; do check "$p" 200; done
          check /catalog 200
          check /privacy 200
          echo "Приватное:"
          for p in /.admin-credentials.json /.git/config /admin-server.js /package.json \
                   /Dockerfile /docker-compose.yml /lib/hse-catalog.js /tests/smoke_test.py \
                   /admin.html /README.md /js/../admin-server.js; do check "$p" 404; done

          docker rm -f nginx-check >/dev/null
          exit $fail

  # ── Деплой (выключен до появления сервера) ───────────────────────────
  # Когда будет VPS и домен, добавить секреты DEPLOY_HOST / DEPLOY_USER /
  # DEPLOY_KEY в настройках репозитория и снять комментарий.
  #
  # deploy:
  #   name: Деплой на сервер
  #   runs-on: ubuntu-latest
  #   needs: build
  #   if: github.ref == 'refs/heads/main'
  #   steps:
  #     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
  #     - name: Выкатить по SSH
  #       run: |
  #         echo "${{ secrets.DEPLOY_KEY }}" > key && chmod 600 key
  #         # ВАЖНО: exclude'ы ниже защищают runtime-состояние на сервере от
  #         # rsync --delete. Их нет в дереве исходников, поэтому без exclude
  #         # каждый деплой стирал бы пароль админки (.admin-credentials.json),
  #         # накопленную аналитику (.analytics/) и локальный каталог программ.
  #         rsync -az --delete -e "ssh -i key -o StrictHostKeyChecking=accept-new" \
  #           --exclude '.git' --exclude '.venv-tests' --exclude 'node_modules' \
  #           --exclude '.admin-credentials.json' --exclude '.admin-status.json' \
  #           --exclude '.analytics' --exclude '.catalog-data.json' \
  #           --exclude '.catalog-schedule.json' --exclude '.catalog-update.lock' \
  #           ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/dpo/
  #         ssh -i key -o StrictHostKeyChecking=accept-new \
  #           ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
  #           'cd /srv/dpo && docker compose up -d --build'
