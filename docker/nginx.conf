# Кеш выбирается по расширению итогового файла. map вычисляется в момент
# отдачи ответа, поэтому для ЧПУ-адресов ($uri к тому времени уже указывает
# на реальный файл) он тоже срабатывает — раньше на /catalog заголовок
# терялся, потому что try_files не перематчивает location.
map $uri $cache_control {
    default                            "no-cache";           # HTML: переспроси перед показом
    ~*\.woff2$                         "public, max-age=31536000, immutable";
    ~*\.(jpg|jpeg|png|webp|svg|ico)$   "public, max-age=2592000";
    # CSS/JS — сутки: в cookie-consent.js вписывается номер Метрики, годовой
    # кеш означал бы, что у части посетителей счётчик не появится очень долго.
    ~*\.(css|js)$                      "public, max-age=86400";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Относительные Location в редиректах: иначе nginx подставляет свой порт (80)
    # и локально «/catalog» уводит с localhost:8080 на localhost. За обратным
    # прокси/TLS это тоже правильнее.
    absolute_redirect off;

    # Имена файлов и содержимое страниц — UTF-8 (кириллица в путях: «Каталог программ.html»)
    charset utf-8;
    charset_types text/html text/css text/javascript application/json image/svg+xml;

    # Не сообщать версию nginx в заголовке Server
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/html text/css text/javascript application/javascript application/json image/svg+xml application/xml;

    # Заголовки задаются один раз на уровне server и наследуются всеми location,
    # пока внутри location нет своего add_header (тогда наследование обрывается).
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Защита от кликджекинга: в meta CSP frame-ancestors не работает, только
    # заголовком. Оба варианта вместе — X-Frame-Options понимают старые
    # браузеры, frame-ancestors стандартный. Iframe на сайте не используется
    # нигде, поэтому запрет полный, а не SAMEORIGIN. См. docs/hosting-headers.md
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # HSTS включать только после TLS — иначе браузер запомнит https для домена,
    # на котором сертификата ещё нет, и сайт станет недоступен.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Человекопонятные адреса ────────────────────────────────────────
    # Файлы называются по-русски и с пробелами — в рекламе и выдаче такие
    # ссылки выглядят как «%D0%9A%D0%B0...». Канонические адреса короткие,
    # а старые пути 301-редиректом уводят на них, чтобы не плодить дубли.
    location = /catalog  { try_files "/Каталог программ.html" =404; }
    location = /privacy  { try_files /privacy.html =404; }

    location = /catalog.html                        { return 301 /catalog; }
    # Русское имя файла тоже уводим на короткий адрес — один канонический URL.
    location = "/Каталог программ.html"             { return 301 /catalog; }
    location = /privacy.html                        { return 301 /privacy; }

    # Осторожно: директива index сама делает ВНУТРЕННИЙ переход на /index.html,
    # и безусловный «return 301 /» в этом location зациклил бы главную.
    # Поэтому редирект только если /index.html запросил клиент.
    location = /index.html {
        if ($request_uri = /index.html) { return 301 /; }
        try_files $uri =404;
    }

    # Архив старых версий лендинга. Файлы нужны в репозитории для истории,
    # но в вебе это дубли главной — поисковик мог бы их проиндексировать.
    location ^~ /archive/ { return 404; }

    # Админка — Node-сервис на отдельном порту, в публичной раздаче её быть не должно
    location = /admin.html { return 404; }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
        try_files $uri $uri/ =404;
    }
}
