# Кеш выбирается по расширению итогового файла. map вычисляется в момент
# отдачи ответа, поэтому для ЧПУ-адресов ($uri к тому времени уже указывает
# на реальный файл) он тоже срабатывает — раньше на /catalog заголовок
# терялся, потому что try_files не перематчивает location.
map $uri $cache_control {
    default                            "no-cache";           # HTML: переспроси перед показом
    ~*\.woff2$                         "public, max-age=31536000, immutable";
    ~*\.(jpg|jpeg|png|webp|svg|ico)$   "public, max-age=2592000";
    # CSS/JS — сутки: в cookie-consent.js вписывается номер Метрики, годовой
    # кеш означал бы, что у части посетителей счётчик не появится очень долго.
    ~*\.(css|js)$                      "public, max-age=86400";
}

# Лимит на публичный маяк аналитики. Per-IP троттлинг админ-сервера здесь не
# работает: за прокси он видит адрес контейнера nginx, и все посетители делят
# один бакет — один флудер молча глушил бы сбор статистики для всех. Поэтому
# честный per-IP лимит ставится на входе. 10 r/s с запасом: штатный клиент
# (js/site-analytics.js) шлёт события пачками изредка.
limit_req_zone $binary_remote_addr zone=dpo_collect:1m rate=10r/s;

# Приём заявок. Лимит на порядок строже маяка: заявку человек подаёт раз в
# несколько минут, а не десять раз в секунду. Всплеск разрешён небольшой —
# ровно чтобы повторная отправка после исправленной опечатки не упёрлась в
# лимит.
limit_req_zone $binary_remote_addr zone=dpo_application:1m rate=1r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Относительные Location в редиректах: иначе nginx подставляет свой порт (80)
    # и локально «/catalog» уводит с localhost:8080 на localhost. За обратным
    # прокси/TLS это тоже правильнее.
    absolute_redirect off;

    # Имена файлов и содержимое страниц — UTF-8 (кириллица в путях: «Каталог программ.html»)
    charset utf-8;
    charset_types text/html text/css text/javascript application/json image/svg+xml;

    # Не сообщать версию nginx в заголовке Server
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/html text/css text/javascript application/javascript application/json image/svg+xml application/xml;

    # Заголовки задаются один раз на уровне server и наследуются всеми location,
    # пока внутри location нет своего add_header (тогда наследование обрывается).
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Защита от кликджекинга: в meta CSP frame-ancestors не работает, только
    # заголовком. Оба варианта вместе — X-Frame-Options понимают старые
    # браузеры, frame-ancestors стандартный. Iframe на сайте не используется
    # нигде, поэтому запрет полный, а не SAMEORIGIN. См. docs/hosting-headers.md
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # HSTS включать только после TLS — иначе браузер запомнит https для домена,
    # на котором сертификата ещё нет, и сайт станет недоступен.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Человекопонятные адреса ────────────────────────────────────────
    # Файлы называются по-русски и с пробелами — в рекламе и выдаче такие
    # ссылки выглядят как «%D0%9A%D0%B0...». Канонические адреса короткие,
    # а старые пути 301-редиректом уводят на них, чтобы не плодить дубли.
    location = /catalog  { try_files "/Каталог программ.html" =404; }
    location = /privacy  { try_files /privacy.html =404; }

    location = /catalog.html                        { return 301 /catalog; }
    # Русское имя файла тоже уводим на короткий адрес — один канонический URL.
    location = "/Каталог программ.html"             { return 301 /catalog; }
    location = /privacy.html                        { return 301 /privacy; }

    # Осторожно: директива index сама делает ВНУТРЕННИЙ переход на /index.html,
    # и безусловный «return 301 /» в этом location зациклил бы главную.
    # Поэтому редирект только если /index.html запросил клиент.
    location = /index.html {
        if ($request_uri = /index.html) { return 301 /; }
        try_files $uri =404;
    }

    # Архив старых версий лендинга. Файлы нужны в репозитории для истории,
    # но в вебе это дубли главной — поисковик мог бы их проиндексировать.
    location ^~ /archive/ { return 404; }

    # Админка — Node-сервис на отдельном порту, в публичной раздаче её быть не должно
    location = /admin.html { return 404; }

    # ── Белый список публичных адресов ─────────────────────────────────
    # В контейнер примонтирован ВЕСЬ каталог проекта: он же рабочая копия, из
    # которой админка переписывает каталог программ. Вместе с ним под корень
    # веб-сервера попадают admin-server.js, Dockerfile, docker-compose.yml,
    # .git/ и .admin-credentials.json — файл с логином админки и хешем пароля.
    # Без этого правила nginx отдавал их по HTTP кому угодно.
    #
    # Список именно белый, а не чёрный: при чёрном любой новый файл в
    # репозитории становится публичным по умолчанию, и узнают об этом уже
    # после утечки. Здесь наоборот — новый публичный файл нужно внести сюда
    # осознанно.
    #
    # Канонические адреса (/catalog, /privacy) и редиректы описаны выше через
    # location = — точное совпадение имеет приоритет над регулярным выражением,
    # поэтому это правило их не перехватывает. Внутренние переходы try_files
    # заново по location тоже не матчатся, так что «Каталог программ.html»
    # продолжает читаться с диска.
    # programs/ — страницы программ, которые собирает
    # scripts/build-program-pages.js. Разрешены только .html и .css и только
    # на один уровень: вложенных каталогов там нет, а без ограничения по
    # расширению папка стала бы дырой для любого случайно положенного файла.
    location ~ "^/programs/[^/]+\.(html|css)$" {
        try_files $uri =404;
    }

    location ~ "^/(?!$|index\.html$|404\.html$|favicon\.svg$|robots\.txt$|sitemap\.xml$|fonts/|images/|js/)" {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Маяк аналитики. Страницу отдаёт nginx, а собирает данные админ-сервис —
    # без этого проксирования POST /api/collect упирался бы в статику и
    # возвращал 405/404: у посетителя ошибка в консоли, а статистика молча не
    # собирается, хотя политика обработки ПДн обещает сбор.
    # Принимающая сторона сверяет Origin со списком SITE_ORIGIN — он задан в
    # docker-compose.yml и должен совпадать с адресом, по которому открыт сайт.
    location = /api/collect {
        limit_except POST { deny all; }
        # 429 (а не дефолтный 503): иначе перелимит маскировался бы ниже
        # error_page-перехватом 503 → 204 и был бы неотличим от успеха.
        limit_req zone=dpo_collect burst=20 nodelay;
        limit_req_status 429;
        # Адрес апстрима — через переменную, и это принципиально: с литеральным
        # «proxy_pass http://admin:5178» nginx резолвит имя при загрузке конфига
        # и ОТКАЗЫВАЕТСЯ СТАРТОВАТЬ, если админ-сервис ещё не поднялся, — то
        # есть весь сайт лежит из-за необязательной аналитики. С переменной имя
        # резолвится на каждый запрос (resolver — встроенный DNS Docker), и
        # недоступность админки превращается в 502 → перехватывается ниже.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $dpo_admin "http://admin:5178";
        proxy_pass $dpo_admin$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header Origin            $http_origin;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Маяк шлётся в том числе через sendBeacon при уходе со страницы —
        # ждать ответа незачем, лучше быстро отпустить соединение.
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
        # Если админ-сервис недоступен, посетитель не должен видеть ошибку:
        # аналитика не критична для просмотра сайта.
        proxy_intercept_errors on;
        error_page 502 503 504 = @collect_down;
    }
    location @collect_down { return 204; }

    # Заявка на программу. Проксируется туда же, куда маяк, но обращаться с
    # ней надо иначе: маяк можно молча проглотить, заявку — нельзя.
    #
    # Если приёмник недоступен, посетитель ОБЯЗАН увидеть ошибку и позвонить
    # или написать: человек, нажавший «Отправить», считает, что его заявку
    # получили. Поэтому здесь нет ни error_page-заглушки, ни подмены кода на
    # успех — 502 доходит до браузера, и форма показывает телефон центра.
    location = /api/application {
        limit_except POST { deny all; }
        limit_req zone=dpo_application burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $dpo_admin_app "http://admin:5178";
        proxy_pass $dpo_admin_app$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header Origin            $http_origin;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Дольше, чем у маяка: запись на диск и ответ идут до отправки
        # письма, но запас на медленный диск нужен.
        proxy_read_timeout    15s;
    }

    # Остальные /api/* наружу не выставляем: админские маршруты закрыты
    # авторизацией, но и светить их на публичном сайте незачем.
    location ^~ /api/ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
