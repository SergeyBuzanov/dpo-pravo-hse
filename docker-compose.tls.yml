# Включается поверх docker-compose.yml, когда есть сертификат:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Кладите fullchain.pem и privkey.pem в ./certs/
# HSTS здесь, и только здесь: без живого TLS браузер запомнит https и сайт пропадёт.

services:
  site:
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./docker/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - .:/usr/share/nginx/html:ro
    environment:
      # не используется nginx'ом, метка для оператора
      DPO_TLS: "1"
