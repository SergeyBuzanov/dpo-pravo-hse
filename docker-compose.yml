# Локальный запуск: статический сайт (nginx) + приём заявок + админка.
#   docker compose up -d
#   Сайт:   http://localhost:8080/
#   Админка: http://localhost:5178/admin.html
#   TLS:    docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Секреты и журнал заявок живут в .data/ (вне document root nginx).

services:
  site:
    image: nginx:1.27-alpine
    container_name: dpo-site
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Монтируется весь проект, и это осознанно: админка переписывает
      # «Каталог программ.html» атомарно (временный файл + переименование), а
      # при bind-mount ОТДЕЛЬНОГО ФАЙЛА на Linux контейнер остаётся с прежним
      # inode и продолжает отдавать старую страницу. Поэтому публичную
      # поверхность ограничивает белый список в docker/nginx.conf, а не набор
      # монтирований: код админки, .git и креды в dpo-data наружу не отдаются.
      - .:/usr/share/nginx/html:ro
    depends_on:
      - intake
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt:
      - no-new-privileges:true

  intake:
    build: .
    container_name: dpo-intake
    command: ["node", "intake-server.js"]
    environment:
      HOST: "0.0.0.0"
      PORT: "5179"
      SITE_ORIGIN: "http://localhost:8080,http://127.0.0.1:8080"
      TRUST_PROXY: "1"
      DPO_DATA_DIR: "/data"
    volumes:
      - .:/app
      - ./.data:/data
    expose:
      - "5179"
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt:
      - no-new-privileges:true

  admin:
    build: .
    container_name: dpo-admin
    ports:
      - "127.0.0.1:5178:5178"
    environment:
      SITE_ORIGIN: "http://localhost:8080,http://127.0.0.1:8080"
      TRUST_PROXY: "1"
      DISABLE_PUBLIC_INTAKE: "1"
      ADMIN_ALLOW_BASIC: "0"
      DPO_DATA_DIR: "/data"
    volumes:
      - .:/app
      - ./.data:/data
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt:
      - no-new-privileges:true
