# Локальный запуск: статический сайт (nginx) + админка каталога (Node).
#   docker compose up -d
#   Сайт:   http://localhost:8080/
#   Админка: http://localhost:5178/admin.html  (логин/пароль — в логах: docker compose logs admin)

services:
  site:
    image: nginx:1.27-alpine
    container_name: dpo-site
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Монтируется весь проект, и это осознанно: админка переписывает
      # «Каталог программ.html» атомарно (временный файл + переименование), а
      # при bind-mount ОТДЕЛЬНОГО ФАЙЛА на Linux контейнер остаётся с прежним
      # inode и продолжает отдавать старую страницу. Поэтому публичную
      # поверхность ограничивает белый список в docker/nginx.conf, а не набор
      # монтирований: код админки, .git и .admin-credentials.json лежат в этом
      # каталоге, но наружу не отдаются. Список закреплён тестом
      # tests/security_test.py — «белый список nginx».
      - .:/usr/share/nginx/html:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  admin:
    build: .
    container_name: dpo-admin
    # Только на localhost хоста — админка не должна быть видна из сети
    ports:
      - "127.0.0.1:5178:5178"
    environment:
      # Расписание автообновления каталога задаётся в админке и хранится в
      # .catalog-schedule.json — переменных окружения для него нет.
      #
      # Адрес(а), по которым открыт сайт: с них принимается маяк /api/collect,
      # проксируемый сюда из nginx. Через запятую. На проде — реальный домен.
      SITE_ORIGIN: "http://localhost:8080"
      # Доверять X-Real-IP от nginx: иначе троттлинг /api/collect видит адрес
      # контейнера nginx и считает всех посетителей одним клиентом.
      TRUST_PROXY: "1"
    volumes:
      # rw: обновление переписывает «catalog.html» в рабочей копии,
      # плюс сюда пишутся .admin-credentials.json и .admin-status.json
      - .:/app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
