<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 509" width="720" height="509" role="img" aria-labelledby="docTitle docDesc">
  <title id="docTitle">Схема бланка документа об образовании</title>
  <desc id="docDesc">Схематичное изображение бланка: поле герба, наименование университета, строка имени выпускника, наименование программы, поля подписей и печати. Условная схема, не образец реального документа.</desc>

  <!-- Условная схема бланка. Текст намеренно заменён полосами: это макет
       композиции, а не воспроизведение настоящего документа НИУ ВШЭ. -->

  <rect width="720" height="509" fill="#F2ECE1"/>

  <!-- Лист -->
  <g>
    <rect x="40" y="28" width="640" height="453" rx="6" fill="#FBF9F5" stroke="rgba(33,30,27,0.1)"/>
    <!-- Наборное поле -->
    <rect x="64" y="52" width="592" height="405" rx="3" fill="none" stroke="rgba(33,30,27,0.1)" stroke-dasharray="3 5"/>
  </g>

  <!-- Верхний акцентный кант -->
  <rect x="40" y="28" width="640" height="8" rx="6" fill="#1658DA"/>
  <rect x="40" y="34" width="640" height="2" fill="#1658DA"/>

  <!-- Место герба -->
  <g transform="translate(360 92)">
    <circle r="26" fill="none" stroke="#1658DA" stroke-width="1.5"/>
    <path d="M-9 10V-6l9-7 9 7v16z" fill="none" stroke="#1658DA" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M-9 2h18" stroke="#1658DA" stroke-width="1.5"/>
  </g>

  <!-- Наименование организации -->
  <g fill="#211E1B" opacity="0.82">
    <rect x="210" y="140" width="300" height="9" rx="4.5"/>
    <rect x="258" y="158" width="204" height="7" rx="3.5" opacity="0.55"/>
  </g>

  <!-- Тип документа -->
  <rect x="285" y="192" width="150" height="12" rx="6" fill="#1658DA"/>

  <!-- Строка имени выпускника -->
  <g>
    <rect x="150" y="243" width="420" height="11" rx="5.5" fill="#211E1B" opacity="0.72"/>
    <rect x="150" y="266" width="420" height="1" fill="rgba(33,30,27,0.1)"/>
  </g>

  <!-- Наименование программы -->
  <g fill="#211E1B" opacity="0.42">
    <rect x="150" y="292" width="420" height="7" rx="3.5"/>
    <rect x="196" y="308" width="328" height="7" rx="3.5"/>
  </g>

  <!-- Объём и период обучения -->
  <g fill="#211E1B" opacity="0.3">
    <rect x="248" y="338" width="224" height="6" rx="3"/>
  </g>

  <!-- Подписи и печать -->
  <g>
    <rect x="104" y="410" width="150" height="1" fill="rgba(33,30,27,0.25)"/>
    <rect x="126" y="420" width="106" height="5" rx="2.5" fill="#211E1B" opacity="0.28"/>

    <rect x="466" y="410" width="150" height="1" fill="rgba(33,30,27,0.25)"/>
    <rect x="488" y="420" width="106" height="5" rx="2.5" fill="#211E1B" opacity="0.28"/>

    <g transform="translate(360 404)">
      <circle r="38" fill="none" stroke="#F0B86E" stroke-width="1.5"/>
      <circle r="30" fill="none" stroke="#F0B86E" stroke-width="1" opacity="0.7"/>
      <circle r="4" fill="#F0B86E" opacity="0.8"/>
    </g>
  </g>
</svg>
