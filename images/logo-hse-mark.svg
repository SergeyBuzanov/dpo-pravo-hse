<!-- Знак НИУ ВШЭ (монограмма в круге), БЕЗ словесного обозначения.

     Источник: официальный брендбук https://www.hse.ru/info/brandbook/,
     архив «сокращённая версия с аббревиатурой» (mirror/pubs/share/1145262286.zip),
     файл 01_Logo_HSE_Short_abbreviation_main_CMYK.svg. Контуры взяты оттуда
     БЕЗ перерисовки: из логотипа вынута первая группа – круг и монограмма, –
     а группа с надписью отброшена. Брендбук прямо разрешает такую версию:
     «подобные версии только со знаком ВШЭ могут использоваться для подписей
     в шапке сайта».

     Официальные цвета брендбука: круг – фирменный синий #102D69, монограмма
     вывернута в белый.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170.1 170.1" role="img" aria-label="НИУ «Высшая школа экономики»">
<style type="text/css">
